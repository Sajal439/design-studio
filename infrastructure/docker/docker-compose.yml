services:
  postgres:
    image: postgres:16
    container_name: goel_postgres
    ports:
      - "5433:5432" 
    environment:
      POSTGRES_DB: goel_studio
      POSTGRES_USER: goel
      POSTGRES_PASSWORD: goel_dev_123
    volumes:
      - goel_pgdata:/var/lib/postgresql/data

volumes:
  goel_pgdata:  
